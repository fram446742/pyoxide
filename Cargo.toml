[workspace]
members = ["crates/cli", "crates/runner"]
# The runner cannot compile without PyO3 embedding artifacts, which
# `pyoxide build-runner` produces. Plain builds and tests must skip it.
default-members = ["crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# The base fork plus the fixes that are not upstream yet, on the fork's
# `fixes/upstream` branch (two commits on top of origin/main). When they land
# upstream, point these at https://github.com/ntamas/PyOxidizer and bump.
pyoxidizer = { git = "https://github.com/fram446742/PyOxidizer", rev = "5c4461593886cd1b3de95ee0e7e03611add24bd3" }
python-packaging = { git = "https://github.com/fram446742/PyOxidizer", rev = "5c4461593886cd1b3de95ee0e7e03611add24bd3" }
pyembed = { git = "https://github.com/fram446742/PyOxidizer", rev = "5c4461593886cd1b3de95ee0e7e03611add24bd3", default-features = false, features = ["serialization", "zipimport"] }

anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
duct = "1.1"
serde = "1.0"
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3"

[profile.release]
# This binary carries a Python payload; the Rust part is a few MB. Same
# settings the fork used: they cost nothing at run time.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

