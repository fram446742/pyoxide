[workspace]
members = ["crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# The base fork, pinned by revision. This line is the only place the
# revision appears: bump it with `just upstream-bump <sha>`.
pyoxidizer = { git = "https://github.com/ntamas/PyOxidizer", rev = "df4d1e7da1feda13de55abc8496bdf68bf9f770f" }

anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }

[profile.release]
# This binary carries a Python payload; the Rust part is a few MB. Same
# settings the fork used: they cost nothing at run time.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
