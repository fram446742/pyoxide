[workspace]
members = ["crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# The base fork, pinned by revision. This line is the only place the
# revision appears: bump it with `just upstream-bump <sha>`.
pyoxidizer = { git = "https://github.com/ntamas/PyOxidizer", rev = "df4d1e7da1feda13de55abc8496bdf68bf9f770f" }
# Same revision: the resource model the package commands write.
python-packaging = { git = "https://github.com/ntamas/PyOxidizer", rev = "df4d1e7da1feda13de55abc8496bdf68bf9f770f" }

serde_json = "1.0"
duct = "1.1"
tempfile = "3"

anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }

[profile.release]
# This binary carries a Python payload; the Rust part is a few MB. Same
# settings the fork used: they cost nothing at run time.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# port/14: wheels can ship modules only as .pyc (numpy has one); upstream's
# scanner at the pinned revision fails on them with a bare ENOENT. The fix is
# in the fork's tree and is on its way upstream; until then this replaces just
# that crate. Delete this block and bump the pin once it lands.
[patch."https://github.com/ntamas/PyOxidizer"]
python-packaging = { git = "https://github.com/fram446742/PyOxidizer", rev = "4bb933a0e845acbc285e8b6a3a398908b3402a8b" }
